<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>献立カレンダー - AI栄養アドバイス</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F6F5EF; --surface:#FFF; --surface-soft:#EFEEE3; --ink:#2F332C; --ink-soft:#80877A;
  --sprout:#5C8A52; --sprout-soft:#E4EFDD; --sun:#E3A23C; --border:#E3E1D3;
  --danger:#C1654A; --sun-col:#C1654A; --sat-col:#5C7FA8;
  --good-bg:#FFFBE6; --good-br:#F0C040; --ok-bg:#EAF2FB; --ok-br:#7AADE0;
  --bad-bg:#FDECEA; --bad-br:#E07A7A;
  --r-lg:16px; --r-md:10px; --r-sm:6px;
  --shadow:0 4px 16px rgba(47,51,44,.06);
  --fd:'Zen Maru Gothic',sans-serif; --fb:'Noto Sans JP',sans-serif; --fm:'Source Code Pro',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);line-height:1.6;}

/* ===== ヘッダー ===== */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.app-title{display:flex;align-items:center;gap:8px;}
.app-title h1{font-family:var(--fd);font-size:1.2rem;margin:0;font-weight:700;}
.app-title p{margin:0;font-size:.72rem;color:var(--ink-soft);}
.level-selector{display:flex;gap:4px;background:var(--surface-soft);border-radius:var(--r-lg);padding:3px;}
.level-btn{border:none;background:transparent;padding:6px 10px;border-radius:var(--r-md);cursor:pointer;font-family:var(--fb);font-size:.78rem;font-weight:500;color:var(--ink-soft);transition:all .2s;white-space:nowrap;}
.level-btn.active{background:var(--surface);color:var(--sprout);box-shadow:var(--shadow);}
.settings-toggle{display:flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:var(--r-md);cursor:pointer;font-size:.82rem;color:var(--ink);white-space:nowrap;}

/* ===== バナー ===== */
.tip-banner{margin:12px 16px 0;background:var(--sprout-soft);border:1px solid var(--sprout);border-radius:var(--r-md);padding:8px 14px;font-size:.8rem;color:#3F5C39;}

/* ===== メインレイアウト ===== */
.app-main{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;padding:16px;max-width:1320px;margin:0 auto;}
@media(max-width:900px){.app-main{grid-template-columns:1fr;}}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;min-width:0;overflow:hidden;}
.card h2{font-family:var(--fd);font-size:1rem;margin:0 0 12px;}

/* ===== カレンダーナビ ===== */
.calendar-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.nav-arrow{width:30px;height:30px;border:1px solid var(--border);background:var(--surface);border-radius:50%;cursor:pointer;font-size:.8rem;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.year-select{border:1px solid var(--border);background:var(--surface-soft);border-radius:var(--r-md);padding:5px 8px;font-family:var(--fd);font-weight:700;font-size:.85rem;color:var(--ink);flex-shrink:0;}
.month-tabs{display:flex;gap:3px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:none;}
.month-tabs::-webkit-scrollbar{display:none;}
.month-tab{border:none;background:var(--surface-soft);border-radius:var(--r-md);padding:5px 10px;font-size:.75rem;font-family:var(--fb);color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:all .2s;}
.month-tab.active{background:var(--sprout);color:#fff;font-weight:500;}
.today-btn{flex-shrink:0;}

/* ===== カレンダー本体 ===== */
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px;width:100%;}
.cal-wd{background:var(--surface-soft);text-align:center;font-size:.7rem;font-weight:700;color:var(--ink-soft);padding:6px 2px;}
.cal-wd.sun{color:var(--sun-col);} .cal-wd.sat{color:var(--sat-col);}
.cal-cell{background:var(--surface);min-height:82px;padding:4px 3px;cursor:pointer;display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden;width:100%;min-width:0;transition:background .15s;}
.cal-cell:hover{background:var(--surface-soft);}
.cal-cell.out{background:#FBFAF6;} .cal-cell.out .cdate{color:#CFCDBE;}
.cal-cell.sun .cdate{color:var(--sun-col);} .cal-cell.sat .cdate{color:var(--sat-col);}
.cal-cell.selected{background:var(--sprout-soft)!important;box-shadow:inset 0 0 0 2px var(--sprout);}
.cal-cell.istoday .cdate{background:var(--sun);color:#fff!important;border-radius:50%;}
.cal-cell.r-good{background:var(--good-bg)!important;border-top:3px solid var(--good-br);}
.cal-cell.r-ok{background:var(--ok-bg)!important;border-top:3px solid var(--ok-br);}
.cal-cell.r-bad{background:var(--bad-bg)!important;border-top:3px solid var(--bad-br);}
.cell-head{display:flex;align-items:center;justify-content:space-between;}
.cdate{font-family:var(--fm);font-size:.72rem;font-weight:500;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cell-kcal{font-size:.58rem;font-weight:700;color:var(--sprout);line-height:1;}
.cell-menu{font-size:.58rem;line-height:1.3;color:var(--ink);overflow:hidden;flex:1;word-break:break-all;}
.cell-mrow{display:flex;align-items:flex-start;gap:1px;overflow:hidden;}
.cell-micon{flex-shrink:0;font-size:.58rem;}
.cell-mtext{overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;word-break:break-all;white-space:normal;font-size:.56rem;}
.cell-comment{font-size:.52rem;color:var(--ink-soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;white-space:normal;word-break:break-all;border-top:1px dashed var(--border);margin-top:1px;padding-top:1px;}
.cell-rbadge{font-size:.65rem;line-height:1;}

/* ===== スマホ対応 ===== */
@media(max-width:480px){
  .cal-cell{min-height:60px;padding:3px 2px;}
  .cdate{width:17px;height:17px;font-size:.62rem;}
  .cell-mtext{display:none;}
  .cell-comment{display:none;}
  .cell-kcal{font-size:.52rem;}
}
@media(max-width:360px){
  .cal-cell{min-height:48px;}
  .cell-menu{display:none;}
}

/* ===== ツールチップ ===== */
.tooltip{position:fixed;display:none;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 8px 24px rgba(47,51,44,.18);padding:10px 12px;max-width:min(300px,calc(100vw - 16px));word-break:break-all;pointer-events:none;}
.tooltip.touch{pointer-events:auto;}
.tt-title{font-family:var(--fd);font-size:.82rem;font-weight:700;margin-bottom:6px;}
.tt-row{display:flex;align-items:flex-start;gap:6px;font-size:.78rem;padding:2px 0;}
.tt-lbl{color:var(--ink-soft);min-width:50px;flex-shrink:0;}
.tt-val{flex:1;line-height:1.4;}
.tt-kcal{font-weight:700;color:var(--sprout);}
.tt-comment{font-size:.74rem;color:var(--ink-soft);margin-top:4px;padding-top:4px;border-top:1px dashed var(--border);line-height:1.4;}
.tt-close{position:absolute;top:4px;right:6px;border:none;background:transparent;font-size:1rem;color:var(--ink-soft);cursor:pointer;display:none;padding:4px;}
.tooltip.touch .tt-close{display:block;}

/* ===== 週間サマリー ===== */
.week-summary{margin-bottom:12px;padding:10px 12px;background:var(--surface-soft);border-radius:var(--r-md);font-size:.78rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.ws-title{font-weight:700;color:var(--sprout);flex-shrink:0;}
.ws-stat{display:flex;gap:3px;align-items:center;}
.ws-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ===== 日付パネル ===== */
.day-panel{margin-top:4px;}
.day-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.day-panel-head h3{font-family:var(--fd);font-size:.95rem;margin:0;}

/* ===== 食事ブロック ===== */
.meal-blocks{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.meal-block{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
.meal-block-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--surface-soft);cursor:pointer;user-select:none;}
.meal-block-head-left{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;}
.meal-block-kcal{font-size:.76rem;font-weight:700;color:var(--sprout);}
.meal-block-body{padding:10px;display:flex;flex-direction:column;gap:8px;}
.meal-block-body.collapsed{display:none;}
.meal-textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 9px;font-family:var(--fb);font-size:.85rem;resize:none;height:56px;line-height:1.5;background:var(--surface);color:var(--ink);}
.meal-textarea:focus{outline:2px solid var(--sprout);outline-offset:1px;}
.meal-photo-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.photo-thumb{position:relative;width:60px;height:60px;border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-thumb-del{position:absolute;top:1px;right:1px;width:16px;height:16px;background:rgba(0,0,0,.55);border:none;border-radius:50%;color:#fff;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.btn-photo{display:flex;align-items:center;gap:5px;border:1px dashed var(--border);background:var(--surface-soft);border-radius:var(--r-sm);padding:6px 10px;font-size:.78rem;cursor:pointer;color:var(--ink-soft);transition:border-color .2s,color .2s;white-space:nowrap;}
.btn-photo:hover{border-color:var(--sprout);color:var(--sprout);}
.meal-block-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn-save{background:var(--sprout);color:#fff;border:none;border-radius:var(--r-sm);padding:7px 12px;font-family:var(--fb);font-weight:500;font-size:.8rem;cursor:pointer;transition:opacity .2s;white-space:nowrap;}
.btn-save:hover{opacity:.85;}
.btn-ai-photo{display:flex;align-items:center;gap:5px;background:#FFF8E1;color:#7A5A00;border:1px solid var(--good-br);border-radius:var(--r-sm);padding:6px 12px;font-size:.78rem;font-family:var(--fb);cursor:pointer;transition:opacity .2s;white-space:nowrap;}
.btn-ai-photo:hover{opacity:.8;}
.btn-ai-photo:disabled{opacity:.4;cursor:not-allowed;}

/* ===== アクションボタン ===== */
.day-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.btn-primary{background:var(--sprout);color:#fff;border:none;border-radius:var(--r-sm);padding:8px 16px;font-family:var(--fb);font-weight:500;font-size:.88rem;cursor:pointer;transition:opacity .2s;}
.btn-primary:hover{opacity:.85;} .btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-secondary{background:var(--surface-soft);color:var(--ink);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 12px;font-size:.82rem;cursor:pointer;transition:border-color .2s,color .2s;font-family:var(--fb);}
.btn-secondary:hover{border-color:var(--sprout);color:var(--sprout);}
.btn-ai-eval{display:flex;align-items:center;gap:5px;background:#FFF8E1;color:#7A5A00;border:1px solid var(--good-br);border-radius:var(--r-sm);padding:7px 12px;font-size:.82rem;font-family:var(--fb);cursor:pointer;transition:opacity .2s;}
.btn-ai-eval:hover{opacity:.8;} .btn-ai-eval:disabled{opacity:.4;cursor:not-allowed;}

/* ===== 評価バッジ ===== */
.rbadge{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:20px;}
.rbadge.good{background:var(--good-bg);color:#7A5A00;border:1px solid var(--good-br);}
.rbadge.ok{background:var(--ok-bg);color:#2A5A8A;border:1px solid var(--ok-br);}
.rbadge.bad{background:var(--bad-bg);color:#8A2A2A;border:1px solid var(--bad-br);}

/* ===== AIコメントボックス ===== */
.ai-box{background:var(--surface-soft);border-radius:var(--r-sm);padding:9px 12px;font-size:.82rem;line-height:1.6;color:var(--ink);border-left:3px solid var(--sprout);white-space:pre-wrap;}
.ai-box.err{border-left-color:var(--danger);}

/* ===== AIチャット ===== */
.ai-card{display:flex;flex-direction:column;}
.chat-log{flex:1;height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-md);padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-soft);}
.cmsg{max-width:90%;padding:7px 11px;border-radius:var(--r-md);font-size:.83rem;line-height:1.55;white-space:pre-wrap;}
.cmsg.user{align-self:flex-end;background:var(--sprout);color:#fff;}
.cmsg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);}
.cmsg.thinking{align-self:flex-start;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);font-style:italic;}
.chat-row{display:flex;gap:7px;}
.chat-row textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 9px;font-family:var(--fb);font-size:.88rem;height:50px;background:var(--surface);color:var(--ink);}
.chat-row textarea:focus{outline:2px solid var(--sprout);outline-offset:1px;}
.ai-note{font-size:.72rem;color:var(--ink-soft);margin-top:7px;line-height:1.5;}

/* ===== 写真モーダル ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;position:relative;}
.modal h3{font-family:var(--fd);font-size:1rem;margin:0 0 14px;}
.modal-close{position:absolute;top:12px;right:14px;border:none;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--ink-soft);}
.photo-preview-large{width:100%;max-height:260px;object-fit:contain;border-radius:var(--r-md);border:1px solid var(--border);margin-bottom:12px;background:#f0f0f0;}
.meal-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.meal-type-btn{border:2px solid var(--border);background:var(--surface-soft);border-radius:var(--r-md);padding:12px 8px;font-size:.9rem;cursor:pointer;text-align:center;font-family:var(--fb);transition:all .2s;}
.meal-type-btn:hover{border-color:var(--sprout);background:var(--sprout-soft);}
.meal-type-btn.selected{border-color:var(--sprout);background:var(--sprout-soft);font-weight:700;}
.modal-result{background:var(--surface-soft);border-radius:var(--r-md);padding:10px 12px;font-size:.84rem;line-height:1.6;margin-bottom:12px;white-space:pre-wrap;border-left:3px solid var(--sprout);}
.modal-result.err{border-left-color:var(--danger);}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;}
.kcal-inline{display:flex;align-items:center;gap:8px;margin-top:6px;}
.kcal-inline label{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;}
.kcal-input{border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:.85rem;width:90px;font-family:var(--fm);}

/* ===== カロリーサマリー（パネル） ===== */
.kcal-summary{background:var(--sprout-soft);border-radius:var(--r-md);padding:8px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;}
.kcal-total{font-weight:700;color:var(--sprout);font-family:var(--fd);}
.kcal-block{color:var(--ink-soft);}

/* ===== ドロワー ===== */
.drawer-overlay{position:fixed;inset:0;background:rgba(47,51,44,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,94vw);background:var(--surface);box-shadow:-4px 0 24px rgba(47,51,44,.12);transform:translateX(100%);transition:transform .25s ease;z-index:21;overflow-y:auto;padding:22px 18px;}
.drawer.open{transform:translateX(0);}
.drawer h2{font-family:var(--fd);font-size:1rem;margin:0 0 4px;}
.drawer p.lead{font-size:.78rem;color:var(--ink-soft);margin:0 0 14px;}
.drawer-close{position:absolute;top:14px;right:14px;border:none;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--ink-soft);}
.dsec{margin-top:18px;}
.dsec h3{font-size:.76rem;margin:0 0 8px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;}
.dsec label{display:block;font-size:.78rem;color:var(--ink-soft);margin:8px 0 3px;}
.dsec input,.dsec select,.dsec textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--fb);font-size:.86rem;background:var(--surface);color:var(--ink);}
.dsec textarea{min-height:80px;resize:vertical;font-family:var(--fm);font-size:.76rem;}
.dsec .fn{font-size:.7rem;color:var(--ink-soft);margin-top:3px;}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.export-btns{display:flex;gap:7px;flex-wrap:wrap;}

/* ===== スピナー ===== */
.spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--sprout);border-radius:50%;animation:spin .7s linear infinite;margin-right:4px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== 詳細ポップアップ ===== */
.detail-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
.detail-popup-overlay.hidden{display:none;}
.detail-popup{background:var(--surface);border-radius:var(--r-lg);padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 16px 48px rgba(47,51,44,.2);}
.detail-popup-close{position:absolute;top:12px;right:14px;border:none;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--ink-soft);}
.detail-popup h3{font-family:var(--fd);font-size:1.05rem;margin:0 0 12px;padding-right:24px;}
.detail-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.detail-section:last-child{border-bottom:none;margin-bottom:0;}
.detail-section-title{font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.detail-meal-row{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
.detail-meal-name{font-size:.88rem;font-weight:500;color:var(--ink);}
.detail-meal-kcal{font-size:.76rem;color:var(--sprout);font-weight:700;}
.detail-meal-memo{font-size:.8rem;color:var(--ink-soft);line-height:1.55;background:var(--surface-soft);border-radius:var(--r-sm);padding:6px 10px;margin-top:4px;white-space:pre-wrap;}
.detail-advice{background:var(--sprout-soft);border-left:3px solid var(--sprout);border-radius:var(--r-sm);padding:10px 14px;font-size:.84rem;line-height:1.6;white-space:pre-wrap;color:var(--ink);}
.detail-advice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;}

/* ===== 詳細パネル（カレンダー下） ===== */
.day-detail-panel{background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-top:14px;}
.day-detail-panel h4{font-family:var(--fd);font-size:.9rem;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
.detail-meal-block{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border);}
.detail-meal-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.detail-meal-block-title{font-size:.82rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.detail-meal-block-text{font-size:.84rem;color:var(--ink);margin-bottom:4px;}
.detail-meal-block-kcal{font-size:.76rem;color:var(--sprout);font-weight:700;margin-bottom:4px;}
.detail-meal-block-memo{font-size:.8rem;color:var(--ink-soft);background:var(--surface);border-radius:var(--r-sm);padding:6px 10px;white-space:pre-wrap;line-height:1.55;border:1px solid var(--border);}
.detail-saved-advice{background:var(--good-bg);border:1px solid var(--good-br);border-radius:var(--r-md);padding:10px 14px;font-size:.82rem;line-height:1.6;color:var(--ink);white-space:pre-wrap;margin-top:10px;}
.detail-saved-advice-title{font-size:.76rem;font-weight:700;color:#7A5A00;margin-bottom:6px;display:flex;align-items:center;gap:4px;}

/* ===== メモ欄 ===== */

function estimateCalorieLocal(text) {
  if (!text || !text.trim()) return 0;
  let total = 0;
  const lower = text.toLowerCase();
  for (const item of CALORIE_DB) {
    if (item.k.some(k => lower.includes(k.toLowerCase()))) {
      total += item.kcal;
    }
  }
  return total || Math.round(text.length * 2.5 + 80); // 最低限の推定
}

/* =====================================================
   状態
===================================================== */
function fmtDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseLocal(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseLocal(s);d.setDate(d.getDate()+n);return fmtDate(d);}
function fmtLabel(s){const d=parseLocal(s);const w=['日','月','火','水','木','金','土'];return`${d.getMonth()+1}月${d.getDate()}日(${w[d.getDay()]})`;}
function esc(s){const e=document.createElement('div');e.textContent=s;return e.innerHTML;}

const TODAY = fmtDate(new Date());
const TODAY_OBJ = new Date();

/* =====================================================
   localStorage 保存・読み込み
===================================================== */
const LS_KEY = 'konndate_meals_v1';
const LS_SETTINGS_KEY = 'konndate_settings_v1';

}

// meals[dateStr] = { morning:{text,kcal}, lunch:{...}, dinner:{...}, snack:{...}, rating, comment }
// ※写真データ(Base64)は保存しない
const state = {
  goalLevel:'balance',
  selectedDate:TODAY,
  calendar:{year:TODAY_OBJ.getFullYear(), month:TODAY_OBJ.getMonth()+1},
  meals: loadMeals(),
  chat:[{role:'ai',text:'こんにちは！📷 写真ボタンで食事を撮影するか、テキストで献立を入力してください。LM Studioが接続されていない場合も一般的なカロリー計算で記録できます。\n\n💾 入力データはこの端末のブラウザに自動保存されます。'}],

function getMeal(ds){
  if(!state.meals[ds]) state.meals[ds]={morning:{text:'',kcal:0,memo:''},lunch:{text:'',kcal:0,memo:''},dinner:{text:'',kcal:0,memo:''},snack:{text:'',kcal:0,memo:''},rating:null,comment:'',aiAdvice:''};
  // 旧データ互換
  MEAL_TYPES.forEach(t=>{
    if(!state.meals[ds][t.id]) state.meals[ds][t.id]={text:'',kcal:0,memo:''};
    if(state.meals[ds][t.id].memo===undefined) state.meals[ds][t.id].memo='';
  });
  if(!state.meals[ds].aiAdvice) state.meals[ds].aiAdvice='';
  return state.meals[ds];
}
function totalKcal(ds){
  const m=getMeal(ds);
  return MEAL_TYPES.reduce((s,t)=>s+(m[t.id]?.kcal||0),0);
}
function hasAnyMeal(ds){
  const m=getMeal(ds);
  return MEAL_TYPES.some(t=>m[t.id]?.text);
}

/* =====================================================
   システムプロンプト
===================================================== */
function buildSysPrompt(){
  const goalDesc={diet:'ダイエット重視（カロリー・糖質を優先）',balance:'バランス重視（五大栄養素）',muscle:'筋トレ・たんぱく質重視'}[state.goalLevel];
  const age=document.getElementById('profileAge')?.value||30;
  const gender={male:'男性',female:'女性',other:'その他'}[document.getElementById('profileGender')?.value||'male'];
  const extra=document.getElementById('aiPromptExtra')?.value||'';
  return `あなたは日本語で応答する栄養アドバイザーです。
ユーザープロフィール：${age}歳 ${gender}、1人分、食事スタイル：${goalDesc}
・調味料の量は考慮せず、食材・料理の内容から栄養を推測してください。
・アドバイスは具体的かつ簡潔に（200字以内）日本語でお願いします。
・評価は「good」「ok」「bad」の3段階で判定してください。
${extra?'追加指示：'+extra:''}
今日の日付: ${TODAY}`;
}

/* =====================================================
   AI呼び出し（テキスト）
===================================================== */
async function callAI(messages, temperature=0.3, maxTokens=500){
  const res = await fetch(state.aiEndpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'local-model', messages, temperature, max_tokens: maxTokens})
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const raw = (data.choices?.[0]?.message?.content||'').trim();
  // <think>...</think> タグを除去（Thinkingモード対応）
  return raw.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
}

/* =====================================================
   AI呼び出し（画像認識）
===================================================== */
async function analyzePhotoWithAI(dataUrl, mealType){
  const typeLabel = MEAL_TYPES.find(t=>t.id===mealType)?.label || '';
  const base64 = dataUrl.split(',')[1];
  const mime   = dataUrl.split(';')[0].split(':')[1];

  const messages = [
    {role:'system', content: buildSysPrompt()},
    {role:'user', content:[
      {type:'image_url', image_url:{url: dataUrl}},
      {type:'text', text:`この写真は${typeLabel}です。写真に写っている食べ物・飲み物をすべて認識し、以下のJSON形式で返してください（JSONのみ、前後の説明不要）：
{"foods":["料理名1","料理名2"],"kcal":推定カロリー合計(数値のみ),"comment":"一言アドバイス（40字以内）"}`}
    ]}
  ];

  const res = await fetch(state.aiEndpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'local-model',messages,temperature:0.2})
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const raw = (data.choices?.[0]?.message?.content||'').trim();
  // <think>...</think> タグを除去（Thinkingモード対応）
  const content = raw.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
  const jsonMatch = content.match(/\{[\s\S]*?\}/);
  if(jsonMatch){
    const parsed = JSON.parse(jsonMatch[0]);
    return {
      foods: parsed.foods || [],
      kcal:  parseInt(parsed.kcal) || 0,
      comment: parsed.comment || ''
    };
  }
  throw new Error('JSON解析失敗: '+content.slice(0,80));
}

}

  document.getElementById('photoModal').classList.add('hidden');
}
function renderMealTypeGrid(){
  const grid = document.getElementById('mealTypeGrid');
  grid.innerHTML = MEAL_TYPES.map(t=>`
    <button class="meal-type-btn${state.photoModal.selectedType===t.id?' selected':''}" data-type="${t.id}">
      ${t.label}
    </button>`).join('');
  grid.querySelectorAll('.meal-type-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.photoModal.selectedType = btn.dataset.type;
      renderMealTypeGrid();
      startPhotoAnalysis();
    });
  });
}

async function startPhotoAnalysis(){
  const area = document.getElementById('photoAnalyzeArea');
  const actions = document.getElementById('photoModalActions');
  const mtype = state.photoModal.selectedType;
  if(!mtype) return;

  area.innerHTML = `<div class="modal-result"><span class="spinner"></span>食事を認識中...</div>`;
  actions.innerHTML = '';

  let result;
  if(state.lmAvailable){
    try{
      result = await analyzePhotoWithAI(state.photoModal.dataUrl, mtype);
    }catch(e){
      // AIが失敗したらローカル推定にフォールバック
      result = null;
      area.innerHTML = `<div class="modal-result err">⚠️ 画像認識に失敗しました（${esc(e.message)}）。<br>テキストで料理名を入力してカロリーを計算します。</div>`;
    }
  }

  if(result){
    state.photoModal.result = result;
    area.innerHTML = `
      <div class="modal-result">
        🍽️ 認識した料理：<strong>${esc(result.foods.join('、'))}</strong><br>
        🔥 推定カロリー：<strong style="color:var(--sprout)">${result.kcal} kcal</strong><br>
        ${result.comment?'💬 '+esc(result.comment):''}
      </div>
      <div class="kcal-inline">
        <label>カロリーを修正：</label>
        <input class="kcal-input" id="modalKcalEdit" type="number" value="${result.kcal}" min="0" max="9999">
        <span style="font-size:.8rem">kcal</span>
      </div>`;
    actions.innerHTML = `

function savePhotoResult(){

  }

  const ds = state.selectedDate;
  const meal = getMeal(ds);
  const block = meal[mtype];

  if(foodText){

  saveMeals(); // localStorage に保存
  closePhotoModal();
  renderDayPanel();

}

/* =====================================================
   AI評価（2段階：①即時短評 ②チャットで詳細）
===================================================== */
async function evaluateDayMeal(ds){
  if(!hasAnyMeal(ds)) return;
  const commentArea = document.getElementById('dayAiCommentArea');
  commentArea.innerHTML = `<div class="ai-box"><span class="spinner"></span>評価中（数秒かかります）...</div>`;
  document.getElementById('btnEvalDay').disabled = true;

  const meal = getMeal(ds);
  const lines = MEAL_TYPES.map(t=>{
    const b=meal[t.id];
    if(!b.text) return null;
    const kcalStr = b.kcal ? `(${b.kcal}kcal)` : '';
    return `${t.label}:${b.text}${kcalStr}`;
  }).filter(Boolean);
  const total = totalKcal(ds);

  // ① ローカルフォールバック（未接続時）
  if(!state.lmAvailable){
    let rating = 'ok';
    const isFemale = document.getElementById('profileGender')?.value==='female';
    const targetKcal = isFemale ? 1600 : 2000;
    if(total>0){
      const ratio = total/targetKcal;
      if(ratio>=0.7 && ratio<=1.2) rating='good';
      else if(ratio<0.5 || ratio>1.5) rating='bad';
    }
    const comment = total>0 ? `合計${total}kcal（目安${targetKcal}kcal）` : '献立を入力するとより詳しく評価できます。';
    getMeal(ds).rating = rating;
    getMeal(ds).comment = comment;
    saveMeals();
    const r = RATINGS[rating];
    commentArea.innerHTML = renderEvalResult(r, comment, true);
    document.getElementById('dayRatingBadge').innerHTML = `<span class="rbadge ${r.cls}">${r.emoji} ${r.label}</span>`;
    document.getElementById('btnEvalDay').disabled = false;
    renderCalendarGrid(); renderWeekSummary();
    return;
  }

  // ② AI評価（JSONのみ・max_tokens:150で高速化）
  // プロンプトを短くして処理時間を削減
  const sysPrompt = `栄養アドバイザー。1人分。食事スタイル:${state.goalLevel}。
JSONのみ返す（前後の説明不要）:{"rating":"good|ok|bad","comment":"日本語短評50字以内"}`;

  const userMsg = `献立:${lines.join('/')} 合計${total}kcal`;

  try{
    const content = await callAI([
      {role:'system', content:sysPrompt},
      {role:'user',   content:userMsg}
    ], 0.2, 150); // max_tokens:150で高速化

    // JSONパース
    const jsonMatch = content.match(/\{[\s\S]*?\}/);
    let rating='ok', shortComment='';
    if(jsonMatch){
      try{
        const p = JSON.parse(jsonMatch[0]);
        rating = ['good','ok','bad'].includes(p.rating) ? p.rating : 'ok';
        shortComment = p.comment || '';
      }catch{}
    }
    // JSONパース失敗時はテキストをそのまま短評に
    if(!shortComment) shortComment = content.slice(0,50);

    getMeal(ds).rating = rating;
    getMeal(ds).comment = shortComment;
    saveMeals();
    const r = RATINGS[rating];
    commentArea.innerHTML = renderEvalResult(r, shortComment, false);
    document.getElementById('dayRatingBadge').innerHTML = `<span class="rbadge ${r.cls}">${r.emoji} ${r.label}</span>`;
  }catch(err){
    commentArea.innerHTML = `<div class="ai-box err">⚠️ 評価に失敗しました。<br><small>${esc(err.message)}</small></div>`;
  }
  document.getElementById('btnEvalDay').disabled = false;
  renderCalendarGrid(); renderWeekSummary();
}

/* =====================================================
   AIチャット
===================================================== */
async function sendChat(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text) return;
  state.chat.push({role:'user',text});
  input.value='';

  // 直近2週間の献立サマリー
  const lines=[];
  for(let i=-14;i<=0;i++){
    const ds=addDays(TODAY,i);
    const m=getMeal(ds);
    const parts=MEAL_TYPES.map(t=>m[t.id]?.text?`${t.label}「${m[t.id].text}(${m[t.id].kcal}kcal)」`:'').filter(Boolean);
    if(parts.length) lines.push(`${fmtLabel(ds)}：${parts.join(' ')}`+(m.rating?`[${m.rating}]`:''));
  }
  const ctx=lines.length?`【直近の献立】\n${lines.join('\n')}\n\n`:'';

  state.chat.push({role:'ai',text:'…'});
  renderChat();

  if(!state.lmAvailable){
    state.chat[state.chat.length-1]={role:'ai',text:'⚠️ LM Studioに接続されていません。LM Studioを起動してローカルサーバーを開始してください。'};
    renderChat(); return;
  }

  try{
    const messages=[
      {role:'system',content:buildSysPrompt()},
      ...state.chat.slice(0,-1).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text})).filter(m=>m.content!=='…'),
      {role:'user',content:ctx+text}
    ];
    const reply=await callAI(messages, 0.5, 1200);
    state.chat[state.chat.length-1]={role:'ai',text:reply||'（応答なし）'};
  }catch(err){
    state.chat[state.chat.length-1]={role:'ai',text:`⚠️ エラー：${err.message}`};
  }
  renderChat();
}

/* =====================================================
   カレンダー描画
===================================================== */
function getCalDays(y,m){
  const cells=[]; const fd=new Date(y,m-1,1); const sw=fd.getDay();
  const dim=new Date(y,m,0).getDate(); const total=Math.ceil((sw+dim)/7)*7;
  for(let i=0;i<total;i++){
    const d=new Date(y,m-1,i-sw+1);
    cells.push({ds:fmtDate(d),day:d.getDate(),wd:d.getDay(),in:d.getMonth()===m-1});
  }
  return cells;
}

function renderCalendarGrid(){
  const grid=document.getElementById('calendarGrid');
  const wdays=['日','月','火','水','木','金','土'];
  let html='';
  wdays.forEach((w,i)=>html+=`<div class="cal-wd${i===0?' sun':i===6?' sat':''}">${w}</div>`);

  getCalDays(state.calendar.year,state.calendar.month).forEach(cell=>{
    const meal=getMeal(cell.ds);
    const kcal=totalKcal(cell.ds);
    let cls='cal-cell';
    if(!cell.in) cls+=' out';
    if(cell.wd===0) cls+=' sun';
    if(cell.wd===6) cls+=' sat';
    if(cell.ds===state.selectedDate) cls+=' selected';
    if(cell.ds===TODAY) cls+=' istoday';
    if(meal.rating) cls+=' '+RATINGS[meal.rating].cellCls;

    const rbadge = meal.rating ? `<span class="cell-rbadge">${RATINGS[meal.rating].emoji}</span>` : '';
    const kcalBadge = kcal>0 ? `<span class="cell-kcal">${kcal}kcal</span>` : '';
    const menuRows = MEAL_TYPES.map(t=>{
      const b=meal[t.id];
      if(!b?.text && !b?.photos?.length) return '';
      const icon=t.label.match(/./u)[0];
      const txt=b.text||(b.photos?.length?'📷':' ');
      return `<div class="cell-mrow"><span class="cell-micon">${icon}</span><span class="cell-mtext">${esc(txt)}</span></div>`;
    }).join('');
    const commentRow = meal.comment ? `<div class="cell-comment">💬${esc(meal.comment)}</div>` : '';

    html+=`<div class="${cls}" data-date="${cell.ds}">
      <div class="cell-head">
        <div class="cdate">${cell.day}</div>
        <div style="display:flex;gap:2px;align-items:center;">${rbadge}${kcalBadge}</div>
      </div>
      <div class="cell-menu">${menuRows}</div>
      ${commentRow}
    </div>`;
  });
  grid.innerHTML=html;
  grid.querySelectorAll('.cal-cell').forEach(el=>{
    el.addEventListener('click',()=>{
      const prevDate = state.selectedDate;
      state.selectedDate=el.dataset.date;
      renderCalendarGrid(); renderDayPanel();
      // 同じ日を再クリック → 詳細ポップアップを表示
      if(prevDate===el.dataset.date && hasAnyMeal(el.dataset.date)){
        showDetailPopup(el.dataset.date);
      }
      if(isTouch()) showTooltip(el,true);
    });
    el.addEventListener('mouseenter',()=>{ if(!isTouch()) showTooltip(el,false); });
    el.addEventListener('mouseleave',()=>{ if(!isTouch()) hideTooltip(); });
  });
}

/* =====================================================
   ツールチップ
===================================================== */
function isTouch(){return window.matchMedia('(hover:none),(pointer:coarse)').matches;}
function showTooltip(el,touch){
  const ds=el.dataset.date; const meal=getMeal(ds);
  if(!hasAnyMeal(ds)&&!meal.rating){hideTooltip();return;}
  const tt=document.getElementById('tooltip');
  tt.classList.toggle('touch',!!touch);
  const kcal=totalKcal(ds);
  const rows=MEAL_TYPES.map(t=>{
    const b=meal[t.id];
    if(!b?.text&&!b?.photos?.length) return '';
    return `<div class="tt-row"><span class="tt-lbl">${t.label}</span><span class="tt-val">${esc(b.text||(b.photos?.length?'📷':''))}${b.kcal?` <b style="color:var(--sprout)">${b.kcal}kcal</b>`:''}</span></div>`;
  }).join('');
  tt.innerHTML=`
    ${touch?'<button class="tt-close" id="ttClose">×</button>':''}
    <div class="tt-title">${fmtLabel(ds)}</div>
    ${rows}
    ${kcal>0?`<div class="tt-row"><span class="tt-lbl">合計</span><span class="tt-kcal">${kcal} kcal</span></div>`:''}
    ${meal.rating?`<div class="tt-row"><span class="tt-lbl">評価</span><span>${RATINGS[meal.rating].emoji} ${RATINGS[meal.rating].label}</span></div>`:''}
    ${meal.comment?`<div class="tt-comment">💬 ${esc(meal.comment)}</div>`:''}`;
  if(touch) tt.querySelector('#ttClose')?.addEventListener('click',e=>{e.stopPropagation();hideTooltip();});
  tt.style.display='block';
  const rect=el.getBoundingClientRect();
  let left=rect.left, top=rect.bottom+4;
  tt.style.left=`${left}px`; tt.style.top=`${top}px`;
  const tr=tt.getBoundingClientRect();
  if(tr.right>window.innerWidth-8) left=window.innerWidth-tr.width-8;
  if(left<8) left=8;
  if(tr.bottom>window.innerHeight-8) top=rect.top-tr.height-4;
  tt.style.left=`${left}px`; tt.style.top=`${top}px`;
}
function hideTooltip(){const t=document.getElementById('tooltip');t.style.display='none';t.classList.remove('touch');}
document.addEventListener('click',e=>{
  const tt=document.getElementById('tooltip');
  if(!tt.classList.contains('touch')) return;
  if(tt.contains(e.target)||e.target.closest?.('.cal-cell')) return;
  hideTooltip();
});

          <label>カロリー（kcal）：</label>
          <input class="kcal-input" type="number" data-kcal="${mt.id}" min="0" max="9999" value="${block.kcal||''}">
          <button class="btn-secondary" data-calcbtn="${mt.id}" style="padding:4px 8px;font-size:.74rem;">自動計算</button>
        </div>
        <div class="meal-block-actions">
          <button class="btn-save" data-savebtn="${mt.id}">💾 保存</button>
          <button class="btn-photo" data-photobtn="${mt.id}">${photoLabel}</button>
        </div>
        <div class="meal-save-note" id="save-note-${mt.id}" style="font-size:.72rem;color:var(--sprout);display:none;margin-top:4px;">✓ 保存しました</div>
      </div>`;
    container.appendChild(div);

    // ブロック折りたたみ
    div.querySelector('.meal-block-head').addEventListener('click',()=>{
      const body=div.querySelector('.meal-block-body');
      body.classList.toggle('collapsed');
    });

    // テキスト入力でカロリー自動計算
    div.querySelector(`[data-type="${mt.id}"].meal-textarea`).addEventListener('input',e=>{
      const auto=estimateCalorieLocal(e.target.value);
      div.querySelector(`[data-kcal="${mt.id}"]`).value=auto;
    });

    // 自動計算ボタン
    div.querySelector(`[data-calcbtn="${mt.id}"]`).addEventListener('click',()=>{
      const txt=div.querySelector(`[data-type="${mt.id}"].meal-textarea`).value;
      div.querySelector(`[data-kcal="${mt.id}"]`).value=estimateCalorieLocal(txt);
    });

    // 保存ボタン → localStorage に保存
    div.querySelector(`[data-savebtn="${mt.id}"]`).addEventListener('click',()=>{
      const txt=div.querySelector(`[data-type="${mt.id}"].meal-textarea`).value.trim();
      const memo=div.querySelector(`[data-memo="${mt.id}"]`).value.trim();
      const kcalVal=parseInt(div.querySelector(`[data-kcal="${mt.id}"]`).value)||0;
      meal[mt.id].text=txt;
      meal[mt.id].memo=memo;
      meal[mt.id].kcal=kcalVal;
      saveMeals();
      const note=div.querySelector(`#save-note-${mt.id}`);
      if(note){ note.style.display='block'; setTimeout(()=>note.style.display='none',2000); }
      renderDayPanel(); renderCalendarGrid(); renderWeekSummary();
      const hasAll=MEAL_TYPES.filter(t=>t.id!=='snack').every(t=>meal[t.id].text);
      if(hasAll&&state.lmAvailable) evaluateDayMeal(ds);
    });

    // 写真ボタン → モーダルを開く（ブロック種別を事前に設定）
    div.querySelector(`[data-photobtn="${mt.id}"]`).addEventListener('click',()=>{
      pendingPhotoType=mt.id;
      document.getElementById('fileInput').click();
    });
  });
}

let pendingPhotoType='lunch';

/* =====================================================
   週間サマリー
===================================================== */
function renderWeekSummary(){
  const el=document.getElementById('weekSummary');
  const y=state.calendar.year, m=state.calendar.month;
  const dim=new Date(y,m,0).getDate();
  let recorded=0,good=0,ok=0,bad=0,kcalSum=0;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(hasAnyMeal(ds)){
      recorded++;
      const meal=getMeal(ds);
      if(meal.rating==='good') good++;
      else if(meal.rating==='ok') ok++;
      else if(meal.rating==='bad') bad++;
      kcalSum+=totalKcal(ds);
    }
  }
  const avgKcal=recorded>0?Math.round(kcalSum/recorded):0;
  el.innerHTML=`
    <span class="ws-title">📊 ${m}月のまとめ</span>
    <span class="ws-stat"><span class="ws-dot" style="background:#CCC"></span>記録:${recorded}日</span>
    <span class="ws-stat"><span class="ws-dot" style="background:var(--good-br)"></span>◎${good}日</span>
    <span class="ws-stat"><span class="ws-dot" style="background:var(--ok-br)"></span>△${ok}日</span>
    <span class="ws-stat"><span class="ws-dot" style="background:var(--bad-br)"></span>✕${bad}日</span>
    ${avgKcal>0?`<span class="ws-stat" style="color:var(--sprout);font-weight:700;">🔥 平均${avgKcal}kcal/日</span>`:''}`;
}

/* =====================================================
   レベルセレクター
===================================================== */
function renderLevelSelector(){
  const el=document.getElementById('levelSelector');
  el.innerHTML=LEVELS.map(l=>`<button class="level-btn${state.goalLevel===l.id?' active':''}" data-level="${l.id}">${l.label}</button>`).join('');
  el.querySelectorAll('.level-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.goalLevel=btn.dataset.level;
      document.getElementById('profileGoal').value=state.goalLevel;
      renderLevelSelector();
      document.getElementById('tipBanner').textContent=TIPS[state.goalLevel];
    });
  });
}

/* =====================================================
   チャット描画
===================================================== */
function renderChat(){
  const log=document.getElementById('chatLog');
  log.innerHTML=state.chat.map((m,i)=>{
    const cls=m.role==='user'?'user':m.text==='…'?'thinking':'ai';
    const saveBtn = (m.role==='ai' && m.text!=='…' && i===state.chat.length-1)
      ? `<div style="margin-top:6px;"><button onclick="saveAdviceToDay(${JSON.stringify(m.text)})" style="background:var(--good-bg);border:1px solid var(--good-br);color:#7A5A00;border-radius:var(--r-sm);padding:4px 10px;font-size:.72rem;cursor:pointer;">💾 この日のアドバイスとして保存</button></div>`
      : '';
    return `<div class="cmsg ${cls}">${esc(m.text)}${saveBtn}</div>`;
  }).join('');
  log.scrollTop=log.scrollHeight;
}

/* =====================================================
   カレンダーナビ
===================================================== */
function renderCalNav(){
  const ys=document.getElementById('yearSelect');
  if(!ys.options.length){
    const base=TODAY_OBJ.getFullYear();
    for(let y=base-2;y<=base+5;y++){const o=document.createElement('option');o.value=y;o.textContent=`${y}年`;ys.appendChild(o);}
  }
  ys.value=state.calendar.year;
  const tabs=document.getElementById('monthTabs');
  tabs.innerHTML='';
  for(let m=1;m<=12;m++){
    const btn=document.createElement('button');
    btn.type='button';btn.className='month-tab'+(m===state.calendar.month?' active':'');btn.textContent=`${m}月`;
    btn.addEventListener('click',()=>{state.calendar.month=m;renderCalNav();renderCalendarGrid();renderWeekSummary();});
    tabs.appendChild(btn);
  }
}
function changeMonth(d){
  let m=state.calendar.month+d, y=state.calendar.year;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  state.calendar.year=y; state.calendar.month=m;
  renderCalNav(); renderCalendarGrid(); renderWeekSummary();
}

/* =====================================================
   エクスポート
===================================================== */
function dlFile(name,content,mime){
  const b=new Blob([content],{type:mime+';charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
document.getElementById('exportCsv').addEventListener('click',()=>{
  const h='日付,朝食,朝kcal,昼食,昼kcal,夕食,夕kcal,おやつ,おやつkcal,合計kcal,評価,AIコメント\n';
  const rows=Object.entries(state.meals).sort().map(([ds,m])=>{
    const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    return [ds,q(m.morning?.text||''),m.morning?.kcal||0,q(m.lunch?.text||''),m.lunch?.kcal||0,
      q(m.dinner?.text||''),m.dinner?.kcal||0,q(m.snack?.text||''),m.snack?.kcal||0,
      totalKcal(ds),m.rating||'',q(m.comment||'')].join(',');
  }).join('\n');
  dlFile('献立記録.csv','\uFEFF'+h+rows,'text/csv');
});
document.getElementById('exportJson').addEventListener('click',()=>{
  const out={};
  Object.entries(state.meals).forEach(([ds,m])=>{
    // 写真データは除いてエクスポート（ファイルサイズ対策）
    const{morning:{photos:_p1,...mb}={},lunch:{photos:_p2,...lb}={},dinner:{photos:_p3,...db}={},snack:{photos:_p4,...sb}={},rating,comment}=m;
    out[ds]={morning:mb,lunch:lb,dinner:db,snack:sb,rating,comment};
  });
  dlFile('献立記録.json',JSON.stringify(out,null,2),'application/json');
});

/* =====================================================
   プロフィール年齢セレクト
===================================================== */
function initAge(){
  const s=document.getElementById('profileAge');
  for(let a=10;a<=90;a++){const o=document.createElement('option');o.value=a;o.textContent=`${a}歳`;if(a===30)o.selected=true;s.appendChild(o);}
}

/* =====================================================
   イベントリスナー
===================================================== */
document.getElementById('prevMonth').addEventListener('click',()=>changeMonth(-1));
document.getElementById('nextMonth').addEventListener('click',()=>changeMonth(1));
document.getElementById('todayBtn').addEventListener('click',()=>{
  const d=parseLocal(TODAY);
  state.calendar.year=d.getFullYear(); state.calendar.month=d.getMonth()+1;
  state.selectedDate=TODAY;
  renderCalNav(); renderCalendarGrid(); renderDayPanel();
});
document.getElementById('yearSelect').addEventListener('change',e=>{
  state.calendar.year=Number(e.target.value);
  renderCalNav(); renderCalendarGrid(); renderWeekSummary();
});
document.getElementById('chatSend').addEventListener('click',sendChat);
document.getElementById('chatInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendChat();}
});
document.getElementById('btnEvalDay').addEventListener('click',()=>evaluateDayMeal(state.selectedDate));
document.getElementById('btnClearDay').addEventListener('click',()=>{
  if(!confirm(`${fmtLabel(state.selectedDate)}の献立をすべて削除しますか？`)) return;
  delete state.meals[state.selectedDate];
  saveMeals(); // localStorage からも削除
  renderCalendarGrid(); renderDayPanel(); renderWeekSummary();
});

// ドロワー
document.getElementById('drawerToggle').addEventListener('click',()=>{document.getElementById('drawer').classList.add('open');document.getElementById('drawerOverlay').classList.add('open');});
['drawerClose','drawerOverlay'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{document.getElementById('drawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('open');}));
// aiEndpoint・profileGoalのイベントは初期化ブロック内で設定済み

// 詳細ポップアップのクローズ
document.getElementById('detailPopupClose').addEventListener('click',()=>{
  document.getElementById('detailPopup').classList.add('hidden');
});
document.getElementById('detailPopup').addEventListener('click',e=>{
  if(e.target===document.getElementById('detailPopup'))
    document.getElementById('detailPopup').classList.add('hidden');
});

// 写真モーダル
document.getElementById('photoModalClose').addEventListener('click',closePhotoModal);
document.getElementById('photoModal').addEventListener('click',e=>{if(e.target===document.getElementById('photoModal'))closePhotoModal();});

// ファイル入力
document.getElementById('fileInput').addEventListener('change',e=>{
  const file=e.target.files?.[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const dataUrl=ev.target.result;
    // pendingPhotoTypeを選択済みにしてモーダルを開く
    openPhotoModal(dataUrl);
    state.photoModal.selectedType=pendingPhotoType;
    renderMealTypeGrid();
    startPhotoAnalysis();
  };
  reader.readAsDataURL(file);
  e.target.value=''; // リセット（同じファイル再選択対応）
});

// キーボードショートカット
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
});

/* =====================================================
   初期化
===================================================== */
initAge();

// localStorage から設定を復元
(function(){
  const s = loadSettings();
  if(s.goalLevel) state.goalLevel = s.goalLevel;
  if(s.aiEndpoint) state.aiEndpoint = s.aiEndpoint;
  if(s.aiPromptExtra) state.aiPromptExtra = s.aiPromptExtra;
  // プロフィール設定の復元（DOM生成後に設定）
  if(s.profileAge){
    const el=document.getElementById('profileAge');
    if(el) el.value=s.profileAge;
  }
  if(s.profileGender){
    const el=document.getElementById('profileGender');
    if(el) el.value=s.profileGender;
  }
  if(s.aiEndpoint){
    const el=document.getElementById('aiEndpoint');
    if(el) el.value=s.aiEndpoint;
  }
  if(s.aiPromptExtra){
    const el=document.getElementById('aiPromptExtra');
    if(el) el.value=s.aiPromptExtra;
  }
  if(s.goalLevel){
    const el=document.getElementById('profileGoal');
    if(el) el.value=s.goalLevel;
  }
})();

// 設定変更時にlocalStorageへ保存
document.getElementById('aiEndpoint').addEventListener('change',e=>{
  state.aiEndpoint=e.target.value; saveSettings(); checkLMStudio();
});
document.getElementById('aiPromptExtra').addEventListener('change',()=>saveSettings());
document.getElementById('profileAge').addEventListener('change',()=>saveSettings());
document.getElementById('profileGender').addEventListener('change',()=>saveSettings());

});

renderLevelSelector();

renderCalNav();
